spring.application.name=multi-currency-expense-tracker
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_tracker
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

jwt.secret=${JWT_SECRET}
frankfurter.base-url=https://api.frankfurter.dev/v1
llm.base-url=${LLM_BASE_URL:http://localhost:11434/v1}
llm.api-key=${LLM_API_KEY:none}
llm.model=${LLM_MODEL:llama3.2}
